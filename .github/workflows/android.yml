name: Build ShowMe Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Inspect project files
        run: |
          echo "Repository root:"
          pwd
          echo "Files:"
          ls -la
          echo "Gradle wrapper:"
          find . -maxdepth 4 -name gradlew -type f

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: No gradlew found in the repository root."
            echo "The Android Gradle project may be inside a subfolder."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Find generated APK
        if: success()
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShowMe-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
